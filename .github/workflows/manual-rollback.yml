name: Manual Deployment Rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to restore (e.g. v1.0.5). Must exist in ECR.'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-2
  ALB_URL: ${{ vars.ALB_URL || 'http://snapbrand-prod-alb-1271941775.ap-southeast-2.elb.amazonaws.com' }}
  DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::581237505874:role/snapbrand-prod-deploy-role' }}

jobs:
  rollback:
    name: "Roll back to ${{ inputs.image_tag }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assume deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Rolling rollback
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: ./scripts/rollback.sh "$IMAGE_TAG"
      - name: Verify
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: ./scripts/smoke_test.sh "$ALB_URL" "$IMAGE_TAG"
