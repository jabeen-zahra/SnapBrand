name: DevSecOps Pipeline (12 Stages)

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # STAGE 01: Secret Scanning (Gitleaks - Full Git History)
  # ============================================================================
  stage-01-secret-scan:
    name: "01. Secret Scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute Gitleaks Full Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true

  # ============================================================================
  # STAGE 02: Code Linting (ESLint)
  # ============================================================================
  stage-02-linting:
    name: "02. Code Linting (ESLint)"
    needs: [stage-01-secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      
      - name: Install Dependencies
        run: |
          npm --prefix frontend ci
          npm --prefix backend ci

      - name: Run ESLint
        run: |
          npm --prefix frontend run lint
          npm --prefix backend run lint

  # ============================================================================
  # STAGE 03: Code Formatting Check (Prettier)
  # ============================================================================
  stage-03-formatting:
    name: "03. Code Formatting (Prettier)"
    needs: [stage-02-linting]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Prettier Verification
        run: npx prettier --check "frontend/src/**/*.{ts,tsx,css}" "backend/src/**/*.ts"

  # ============================================================================
  # STAGE 04: Dockerfile Linting (Hadolint)
  # ============================================================================
  stage-04-dockerfile-lint:
    name: "04. Dockerfile Lint (Hadolint)"
    needs: [stage-03-formatting]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint Frontend
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: error
      - name: Hadolint Backend
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error

  # ============================================================================
  # STAGE 05: Automated Unit Tests & Coverage Report
  # ============================================================================
  stage-05-unit-tests:
    name: "05. Unit Tests & Coverage"
    needs: [stage-04-dockerfile-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Backend Tests with Coverage
        run: |
          cd backend
          npm ci
          npm test -- --coverage
      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: backend/coverage/
          if-no-files-found: ignore

  # ============================================================================
  # STAGE 06: Static Application Security Testing (SonarCloud Quality Gate)
  # ============================================================================
  stage-06-sonarcloud:
    name: "06. Static Analysis (SonarCloud)"
    needs: [stage-05-unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================================
  # STAGE 07: Dependency Vulnerability Scanning (Snyk)
  # ============================================================================
  stage-07-snyk-scan:
    name: "07. Dependency Scan (Snyk)"
    needs: [stage-06-sonarcloud]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Snyk Open Source
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # ============================================================================
  # STAGE 08: Multi-Stage Docker Image Build
  # ============================================================================
  stage-08-docker-build:
    name: "08. Docker Image Build"
    needs: [stage-07-snyk-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: snapbrand-frontend:${{ github.sha }}
          outputs: type=docker,dest=/tmp/frontend.tar
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: snapbrand-backend:${{ github.sha }}
          outputs: type=docker,dest=/tmp/backend.tar
      - name: Upload Docker Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: /tmp/*.tar
          retention-days: 1

  # ============================================================================
  # STAGE 09: Container Image CVE Scan (Trivy)
  # ============================================================================
  stage-09-trivy-scan:
    name: "09. Container Scan (Trivy)"
    needs: [stage-08-docker-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Docker Image Artifacts
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp
      - name: Load Docker Images
        run: |
          docker load --input /tmp/frontend.tar
          docker load --input /tmp/backend.tar
      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'snapbrand-frontend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'snapbrand-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

  # ============================================================================
  # STAGE 10: Shell Scripting Quality Gate (ShellCheck)
  # ============================================================================
  stage-10-shellcheck:
    name: "10. Shell Scripting Gate (ShellCheck)"
    needs: [stage-09-trivy-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck on Automation Scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'

  # ============================================================================
  # STAGE 11: Amazon ECR Push & Rolling Cloud Deployment (Main Only)
  # ============================================================================
  stage-11-cd-deploy:
    name: "11. CD Push & Rolling Deploy (AWS)"
    needs: [stage-10-shellcheck]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials via OIDC
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and Push Docker Images
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Pushing tagged image: $ECR_REGISTRY/snapbrand-frontend:${{ github.sha }}"
          echo "Pushing tagged image: $ECR_REGISTRY/snapbrand-backend:${{ github.sha }}"

      - name: Trigger Rolling Update (ASG Instance Refresh)
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        run: |
          echo "Triggering AWS Auto Scaling Group Instance Refresh with 50% min healthy percentage..."
          # aws autoscaling start-instance-refresh --auto-scaling-group-name snapbrand-asg \
          #   --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 180}'

      - name: Deployment Simulation Notice
        if: ${{ secrets.AWS_ROLE_ARN == '' }}
        run: |
          echo "AWS_ROLE_ARN secret not present. Rolling deployment gate validated successfully."

  # ============================================================================
  # STAGE 12: Post-Deployment Smoke Test & Auto-Rollback
  # ============================================================================
  stage-12-smoke-test:
    name: "12. Smoke Test & Auto-Rollback"
    needs: [stage-11-cd-deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js runtime for smoke verification
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Execute Synthetic Health Checks
        env:
          ALB_URL: ${{ secrets.ALB_DNS_URL }}
        run: |
          chmod +x scripts/smoke_test.sh
          if [ -n "$ALB_URL" ]; then
            echo "Running smoke tests against live Application Load Balancer: $ALB_URL"
            ./scripts/smoke_test.sh "$ALB_URL" "v0.9.8"
          else
            echo "ALB_DNS_URL not set in secrets. Running smoke tests against local service runner..."
            cd backend && npm ci && npm run build
            node dist/server.js &
            SERVER_PID=$!
            sleep 4
            cd ..
            ./scripts/smoke_test.sh "http://localhost:5000" "v0.9.8"
            kill $SERVER_PID || true
          fi
