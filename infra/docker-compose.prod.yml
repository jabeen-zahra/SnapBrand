version: '3.8'

# ==============================================================================
# SnapBrand Production Compose Stack
# Pinned to Amazon ECR immutable tags with non-root runtime environments
# ==============================================================================

services:
  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - snapbrand-prod-net

  frontend:
    image: ${ECR_REGISTRY}/snapbrand-frontend:${IMAGE_TAG:-v1.0.0}
    restart: always
    expose:
      - "8080"
    networks:
      - snapbrand-prod-net

  backend:
    image: ${ECR_REGISTRY}/snapbrand-backend:${IMAGE_TAG:-v1.0.0}
    restart: always
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    networks:
      - snapbrand-prod-net

networks:
  snapbrand-prod-net:
    driver: bridge
