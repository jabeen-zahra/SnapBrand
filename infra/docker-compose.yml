version: '3.8'

services:
  # ============================================================================
  # Nginx Reverse Proxy & SSL Termination
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: snapbrand-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - snapbrand-net

  # ============================================================================
  # Frontend SPA Service (React 19 + Vite + Tailwind CSS)
  # ============================================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: snapbrand-frontend
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - snapbrand-net

  # ============================================================================
  # Backend Microservice API (Node.js + Express + SVG Synthesizer)
  # ============================================================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: snapbrand-backend
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://snapuser:snappass@postgres:5432/snapbrand
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - snapbrand-net

  # ============================================================================
  # Primary Data Store: PostgreSQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: snapbrand-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: snapuser
      POSTGRES_PASSWORD: snappassword_secops_hardened
      POSTGRES_DB: snapbrand
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapuser -d snapbrand"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - snapbrand-net

  # ============================================================================
  # High-Speed Cache & Rate Limiter: Redis 7
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: snapbrand-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - snapbrand-net

networks:
  snapbrand-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
