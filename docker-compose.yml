# SnapBrand local stack:  docker compose up -d --build
# Frontend: http://localhost:3000   Backend API: http://localhost:5000/health
services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - snapbrand-net

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATA_DIR: /app/data
      APP_VERSION: ${IMAGE_TAG:-local}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret-change-me}
    volumes:
      - snapbrand-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - snapbrand-net

networks:
  snapbrand-net:
    driver: bridge

volumes:
  snapbrand-data:
